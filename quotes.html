  <script type="module">
    import SupabaseQuotesManager from './assets/js/supabase-quotes.js'
    
    // Initialize quotes manager
    const quotesManager = new SupabaseQuotesManager()
    
    // Load and display quotes
    async function loadQuotes() {
      try {
        const quotes = await quotesManager.getQuotes()
        console.log('Loaded quotes:', quotes)
        // Display quotes in your UI

    }
