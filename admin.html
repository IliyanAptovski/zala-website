<!DOCTYPE html>
<html lang="bg">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zala | Admin Panel</title>
    <link rel="shortcut icon" href="./assets/img/fav_icon.png" type="image/png">
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/admin.css">
</head>

<body>
    <header class="navbar">
        <div class="logo">
            <img src="./assets/img/logo.png" alt="ZALA Logo">
        </div>
        <nav>
            <ul>
                <li><a href="index.html" id="nav-home" data-i18n="nav.home">Home</a></li>
                <li><a href="renovation.html" id="nav-renovation" data-i18n="nav.renovation">Renovation</a></li>
                <li><a href="quotes.html" id="nav-quotes" data-i18n="nav.quotes">Quotes</a></li>
                <li><a href="records.html" id="nav-records" data-i18n="nav.records">Records</a></li>
                <li><a href="card-game.html" id="nav-card-game" data-i18n="nav.card-game">Kenef</a></li>
                <li><a href="admin.html" id="nav-admin" class="active" data-i18n="nav.admin">Admin</a></li>

                <!-- Auth links - these will be hidden/shown by JavaScript -->
                <li><a href="login.html" id="nav-login" data-i18n="nav.login">Login</a></li>
                <li><a href="signup.html" id="nav-signup" data-i18n="nav.signup">Sign Up</a></li>

                <!-- Logged in user section - hidden by default -->
                <li id="nav-user-greeting" style="display:none;">
                    <span data-i18n="nav.greeting">Hello</span>, <span id="nav-user-name"></span>!
                </li>
                <li>
                    <button id="nav-logout-btn" style="display:none;" data-i18n="nav.logout">Logout</button>
                </li>
            </ul>
        </nav>
        <div class="navbar-controls">
            <div class="navbar-info">
                <div class="navbar-hours" data-i18n="nav.hours">OPEN 24/7</div>
                <div class="navbar-location" data-i18n="nav.location">Studena, Madan Municipality, Smolyan Province
                </div>
            </div>
            <div class="lang-toggle">
                <button id="lang-en">🇬🇧</button>
                <button id="lang-bg" class="active">🇧🇬</button>
            </div>
        </div>
    </header>

    <main class="content">
        <section class="admin-section">
            <h2 class="admin-title" data-i18n="admin.title">Admin - Song of the Week</h2>

            <form id="song-form">
                <div class="form-group">
                    <label for="song-title" data-i18n="admin.songTitle">Song Title</label>
                    <input type="text" id="song-title" placeholder="Enter song title"
                        data-i18n-placeholder="admin.songTitlePlaceholder" maxlength="100">
                    <div class="char-counter" id="char-counter">0/100</div>
                </div>

                <div class="form-group">
                    <label for="audio-file" data-i18n="admin.audioFile">Audio File (MP3)</label>
                    <input type="file" id="audio-file" accept=".mp3">
                    <div class="file-preview" id="audio-preview"></div>
                </div>

                <div class="form-group">
                    <label for="video-file" data-i18n="admin.videoFile">Background Video (MP4)</label>
                    <input type="file" id="video-file" accept=".mp4">
                    <div class="file-preview" id="video-preview"></div>
                </div>

                <button type="button" id="upload-btn" data-i18n="admin.uploadButton">Upload & Update</button>

                <div id="status" data-i18n="admin.statusDefault">Ready to update Song of the Week</div>
            </form>
        </section>
    </main>

    <footer>
        <p id="footer-text" data-i18n="footer.text">© Зала 2025</p>
    </footer>

    <script type="module" src="assets/js/supabase-config.js"></script>
    <script type="module" src="assets/js/supabase-auth.js"></script>
    <script type="module" src="assets/js/main.js"></script>
    <script type="module" src="assets/js/navbar.js"></script>
    <script type="module" src="assets/js/admin-manager.js"></script>
</body>

</html>
