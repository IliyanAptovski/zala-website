    <main class="content card-game-container">
        <section class="game-area">

            <div class="half half-top">

                    <div class="half-label" data-i18n="game.lower">Lower</div>
                </div>
            </div>

            <!-- Center Card -->
            <div class="card-center">
                <div class="card-wrapper" id="cardWrapper">
                    <div class="card" id="card">
                        <div class="card-face card-back"></div>
                        <div class="card-face card-front">
                            <img src="" alt="Card Front" class="card-img" id="cardFrontImg">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bottom Black Half -->
            <div class="half half-bottom">
                <div class="half-content">
                    <div class="half-label" data-i18n="game.higher">Higher</div>
                </div>
            </div>
        </section>
